<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#0E0F1D"/>
  
  <!-- Gradient circle -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6672E7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6672E7;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  <circle cx="96" cy="96" r="76" fill="url(#glow)"/>
  
  <!-- Quote marks -->
  <text x="50" y="80" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="white">"</text>
  <text x="130" y="120" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="white">"</text>
  
  <!-- Sparkles -->
  <g fill="white">
    <polygon points="30,30 32,36 28,36" transform="rotate(0 30 33)"/>
    <polygon points="30,28 26,33 30,38 34,33" />
    
    <polygon points="162,30 164,36 160,36" transform="rotate(0 162 33)"/>
    <polygon points="162,28 158,33 162,38 166,33" />
    
    <polygon points="162,162 164,168 160,168" transform="rotate(0 162 165)"/>
    <polygon points="162,160 158,165 162,170 166,165" />
  </g>
</svg>
